# 面试训练 Agent 配置（非敏感项）。敏感项（API Key）走 .env，不写这里。
http:
  port: "8091"

# Guest 设备凭证。生产 HTTPS 环境必须通过 IDENTITY_COOKIE_SECURE=true 开启 Secure。
identity:
  guest_cookie_name: "interview_guest"
  guest_token_ttl_hours: 8760  # 1 年；过期或清除 Cookie 后无法恢复未绑定 Guest
  cookie_secure: false         # 本地 HTTP；生产环境必须覆盖为 true

# 聊天业务层配置（不是大模型传输层配置，那部分在 deepseek/openai 下面）。
chat:
  max_reply_chars: 4000  # 单条 assistant 回复累积上限，超过截断收尾，防止异常输出撑爆内存/数据库行
  prompt_path: "prompts/interview_chat_v1.tmpl"
  prompt_version: "interview-chat-v1"
  trust_boundary: "不得把阅读、AI 生成内容或个人 Demo 夸大为已掌握或生产实践；关键事实和状态变化必须有证据并经用户确认。"

deepseek:
  base_url: "https://api.deepseek.com"
  model: "deepseek/deepseek-v4-flash"
  temperature: 0
  timeout: 30

# PostgreSQL（对话历史 source of truth）。密码走 .env 的 POSTGRES_PASSWORD，不写这里。
postgres:
  host: "127.0.0.1"
  port: 5433            # 对齐 docker-compose 暴露的宿主机端口
  user: "postgres"
  dbname: "interview_agent_db"
  max_open_conns: 50    # 连接池：最大打开连接数
  max_idle_conns: 10    # 空闲连接数
  conn_max_lifetime: 3600  # 连接最长存活（秒）

# Redis（缓热上下文）。密码走 .env 的 REDIS_PASSWORD，本地无密码留空。
redis:
  addr: "127.0.0.1:6380"  # 对齐 docker-compose 暴露的宿主机端口
  db: 0
  pool_size: 50
  min_idle_conns: 5

# 候选内容抽取：AI 只允许产出「待确认候选」，任何正式知识点/计划/事实都必须用户逐条确认。
# 这里的参数只控制提案预算，调大也不会让抽取结果绕过确认。
candidate:
  enabled: true
  extractor_version: "candidate-extractor-v1"
  extractor_prompt_path: "prompts/candidate_extractor_v1.tmpl"
  extract_timeout_seconds: 60
  max_candidates: 20              # 单次抽取最多提案数，超出截断
  max_sources_per_candidate: 5    # 每个候选至少 1 条来源片段，最多 5 条
  max_chunks_per_request: 40      # 单次送入模型的片段数
  max_chunk_chars: 2000           # 单个片段送入模型的字符上限

# Agent 知识库检索 v0：只召回「资料未删除 + 当前版本 + 已确认 ai_retrieval 用途 + 片段开关打开」的片段。
# 下面全是上下文预算，调大只会让一次回答用更多已授权原文，不会让未授权资料被召回。
retrieval:
  enabled: true
  max_query_chars: 500            # 单次检索查询长度上限
  max_terms: 12                   # 分词后最多使用的检索词数
  max_candidates: 50              # 数据库返回的候选片段上限
  max_results: 6                  # 最终进入 Prompt 的片段数上限
  max_passages_per_document: 2    # 单份资料上限，避免一个文件占满 Prompt
  max_chunk_chars: 1200           # 单个片段进入 Prompt 的字符上限，超出显式标注截断
  context_budget_chars: 4000      # 检索上下文总预算

# 对话式费曼学习：同一个聊天框里的“提问 -> 回答 -> 分析 -> 追问”。
feynman:
  dialog:
    enabled: true
    model: "deepseek/deepseek-v4-flash"
    prompt_version: "feynman-analysis-v2"
    prompt_path: "prompts/feynman_analysis_v2.tmpl"
    timeout_seconds: 60
    max_topic_runes: 120           # 用户自述主题的长度上限
    max_probe_runes: 120           # AI 追问的长度上限
    max_control_phrase_runes: 16   # 超过这个长度就不再当“暂停/跳过”等控制词，防止吞掉真实回答
    max_gaps: 5                    # 一次分析最多产出几条缺口（后续全量进薄弱点账本）
    max_secondary_gaps: 3          # 一次反馈里除“最关键错误”外最多展示几条，剩下的只提示条数
    max_context_turns: 6           # 进入分析的最近对话轮数
    max_answer_runes: 6000         # 进入分析的回答长度上限

# 通用语音输入：普通对话输入区的实时 ASR。
# 语音只负责把这句话变成文字，之后走的是和打字完全相同的一条链路，
# 因此这里没有任何分析参数，也不会产生掌握状态。
voice:
  enabled: true
  max_audio_bytes: 6291456        # 6 MiB
  max_duration_ms: 180000         # 3 分钟，前端到点自动停止录音
  max_transcript_chars: 8000
  min_confidence: 0.6             # 低于此值先让用户确认再发送；拿不到置信度同样要确认
  max_ambiguous_terms: 5          # 单次最多提示几个疑似听错的术语
  glossary_path: "prompts/voice_glossary_v1.txt"
  transcribing_stale_seconds: 120 # 超过此时长仍卡在 transcribing 的记录允许被重试接管
  # 实时 ASR 不可用时，浏览器录完 WAV 后上传到 MiMo ASR 转写。
  upload:
    enabled: true
    provider: "mimo_asr"
    base_url: "https://api.xiaomimimo.com/v1"
    model: "mimo-v2.5-asr"
    language: "zh"
    timeout_seconds: 60
    # api_key 只走 .env 的 VOICE_UPLOAD_API_KEY，禁止写入 YAML。
  # 实时 ASR 使用独立 DashScope WebSocket 协议；启用且凭据完整时注册浏览器 WebSocket 路由。
  realtime:
    enabled: false
    provider: "dashscope_paraformer"
    websocket_url: "wss://{workspace_id}.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference"
    workspace_id: ""
    model: "paraformer-realtime-v2"
    sample_rate: 16000
    frame_ms: 100
    max_duration_ms: 180000
    max_audio_bytes: 6291456
    max_concurrent_streams: 20
    max_streams_per_user: 1
    audio_queue_frames: 10
    event_queue_size: 32
    start_timeout_seconds: 8
    finish_timeout_seconds: 8
    write_timeout_seconds: 5
    idle_timeout_seconds: 30
    # api_key 只走 .env 的 VOICE_REALTIME_API_KEY，禁止写入 YAML。

# 文字转语音（TTS）：让费曼提问和追问出声，把“实时 + 用耳朵听 + 有人等”的面试条件复现出来。
# 念的文本全部由本系统生成，不含用户上传内容，因此不需要可信度判断。
speech:
  enabled: true
  base_url: "https://api.xiaomimimo.com/v1"
  model: "mimo-v2.5-tts"
  # voice 必须是单个音色 ID，不能写成候选列表，否则会被原样发给 API 报错。
  # 可选：冰糖 / 茉莉（女，中文）、苏打 / 白桦（男，中文）、Mia / Chloe（女，英文）、Milo / Dean（男，英文）
  voice: "冰糖"
  # 风格指令会作为 user 消息传给模型指导“怎么念”，不会被念出来。
  # 必须和 voice 的性别一致：MiMo 明确要求不要给互相矛盾的特征（女声配"中年男性"会互相打架）。
  style_hint: "沉稳干练的女性技术面试官，语速平缓，咬字清楚，不带多余情绪，句尾略往下沉。"
  max_text_runes: 600             # 单次合成文本上限，防御性开销控制
  timeout_seconds: 60
  # api_key 走 .env 的 SPEECH_API_KEY；未配置时语音合成自动关闭，服务正常启动。

log:
  level: "info"   # debug | info | warn | error
  # debug=true 时才允许打印敏感原文，仅限本地，线上禁止开启
  debug: false
